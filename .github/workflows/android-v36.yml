name: Prism Hop Android V3.6.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Prism-Hop-V3.6-Android-Source.zip'
      - '.github/v361/**'
      - '.github/workflows/android-v36.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Expand Prism Hop V3.6 baseline
        run: |
          unzip -q Prism-Hop-V3.6-Android-Source.zip -d build-src
          cp -R build-src/Prism-Hop-V3.6-Android/android ./android
          printf '\nandroid.useAndroidX=true\n' >> android/gradle.properties
      - name: Apply V3.6.1 native and UI polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          p=Path('android/app/src/main/assets/index.html.gz.b64')
          p.with_name('index.html').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))
          PY
          for p in .github/v361/index-1.patch .github/v361/index-2.patch .github/v361/index-3.patch .github/v361/index-4.patch; do
            patch --batch android/app/src/main/assets/index.html < "$p"
          done
          patch --batch android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java < .github/v361/mainactivity.patch
          patch --batch android/app/build.gradle < .github/v361/gradle.patch
      - name: Apply V3.6.2 competitive session version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          html=Path('android/app/src/main/assets/index.html')
          s=html.read_text()
          s=s.replace('Prism Hop V3.6.1','Prism Hop V3.6.2')
          s=s.replace('3.6.1-android','3.6.2-android')
          html.write_text(s)
          gradle=Path('android/app/build.gradle')
          g=gradle.read_text().replace('versionCode 37','versionCode 38',1).replace("versionName '3.6.1-test'","versionName '3.6.2-test'",1)
          gradle.write_text(g)
          activity=Path('android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java')
          a=activity.read_text().replace('private static final String APP_VERSION = "3.6.1-test";','private static final String APP_VERSION = "3.6.2-test";',1)
          activity.write_text(a)
          raw=html.read_bytes()
          Path('android/app/src/main/assets/index.html.gz.b64').write_text(base64.b64encode(gzip.compress(raw,compresslevel=9)).decode())
          PY
          grep -q 'versionCode 38' android/app/build.gradle
          grep -q '3.6.2-android' android/app/src/main/assets/index.html
          grep -q 'home-prism-orbit' android/app/src/main/assets/index.html
          grep -q 'FrameLayout root' android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java
          zip -qr Prism-Hop-V3.6.2-Android-Source.zip android -x 'android/.gradle/*' 'android/app/build/*'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore Prism Hop upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PRISM_HOP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prism-hop-upload.jks"
          test -s "$RUNNER_TEMP/prism-hop-upload.jks"
      - name: Build V3.6.2
        run: gradle -p android :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Sign V3.6.2 release AAB
        env:
          STORE_PASS: ${{ secrets.PRISM_HOP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.PRISM_HOP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRISM_HOP_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/prism-hop-upload.jks" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab Prism-Hop-V3.6.2-Play-Signed.aab
      - name: Inspect outputs
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -s Prism-Hop-V3.6.2-Play-Signed.aab
          test -s Prism-Hop-V3.6.2-Android-Source.zip
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk Prism-Hop-V3.6.2-Play-Signed.aab Prism-Hop-V3.6.2-Android-Source.zip | tee Prism-Hop-V3.6.2-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Hop-V3.6.2-Play-Signed
          path: |
            Prism-Hop-V3.6.2-Play-Signed.aab
            android/app/build/outputs/apk/debug/app-debug.apk
            Prism-Hop-V3.6.2-Android-Source.zip
            Prism-Hop-V3.6.2-SHA256.txt
          if-no-files-found: error
          retention-days: 14
