name: Prism Hop Android V3.6.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Prism-Hop-V3.6-Android-Source.zip'
      - '.github/workflows/android-v36.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Expand Prism Hop Android source
        run: |
          unzip -q Prism-Hop-V3.6-Android-Source.zip -d build-src
          cp -R build-src/Prism-Hop-V3.6-Android/android ./android
          printf '\nandroid.useAndroidX=true\n' >> android/gradle.properties
      - name: Decode web asset and inspect V3.6.1 targets
        run: |
          base64 --decode android/app/src/main/assets/index.html.gz.b64 | gzip -dc > /tmp/prism-index.html
          echo '===== WEB TARGET MATCHES ====='
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/prism-index.html')
          lines=p.read_text(errors='ignore').splitlines()
          rx=re.compile(r'connection interrupted|personal best saved|offline demo|server-issued|there.?s more hop|find your flow|splash|prism-runs|wmicrzmalyekinqvcuxt|supabase|navigator\.onLine|fetch\(|heartbeat|pulse|hero|ring|scroll|home|result|death|hud|flow',re.I)
          hits=[i for i,l in enumerate(lines) if rx.search(l)]
          print('line_count=',len(lines),'hit_count=',len(hits))
          shown=[]
          for i in hits:
              a=max(0,i-5); b=min(len(lines),i+8)
              if any(not (b < x or a > y) for x,y in shown): continue
              shown.append((a,b))
              print(f'--- CONTEXT {i+1} ---')
              for j in range(a,b): print(f'{j+1}: {lines[j]}')
              if len(shown)>=95: break
          PY
          echo '===== NATIVE FILES ====='
          sed -n '1,340p' android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java
          echo '===== THEME ====='
          cat android/app/src/main/res/values/themes.xml
          echo '===== NETWORK SECURITY ====='
          cat android/app/src/main/res/xml/network_security_config.xml
          echo '===== APP BUILD ====='
          sed -n '1,180p' android/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore Prism Hop upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PRISM_HOP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prism-hop-upload.jks"
          test -s "$RUNNER_TEMP/prism-hop-upload.jks"
      - name: Build debug APK and unsigned release AAB
        run: gradle -p android :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Sign release AAB with permanent upload key
        env:
          STORE_PASS: ${{ secrets.PRISM_HOP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.PRISM_HOP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRISM_HOP_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASS"
          test -n "$KEY_PASS"
          test -n "$KEY_ALIAS"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/prism-hop-upload.jks" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab Prism-Hop-V3.6.1-Play-Signed.aab
      - name: Inspect outputs
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -s Prism-Hop-V3.6.1-Play-Signed.aab
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk Prism-Hop-V3.6.1-Play-Signed.aab | tee Prism-Hop-V3.6.1-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Hop-V3.6.1-Play-Signed
          path: |
            Prism-Hop-V3.6.1-Play-Signed.aab
            android/app/build/outputs/apk/debug/app-debug.apk
            Prism-Hop-V3.6.1-SHA256.txt
          if-no-files-found: error
          retention-days: 14
