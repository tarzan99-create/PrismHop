name: Prism Hop Android V3.10.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Prism-Hop-V3.6-Android-Source.zip'
      - '.github/v361/**'
      - '.github/v370/**'
      - '.github/v380/**'
      - '.github/v390/**'
      - '.github/v391/**'
      - '.github/v392/**'
      - '.github/v3100/**'
      - '.github/workflows/android-v36.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Expand Prism Hop V3.6 baseline
        run: |
          unzip -q Prism-Hop-V3.6-Android-Source.zip -d build-src
          cp -R build-src/Prism-Hop-V3.6-Android/android ./android
          printf '\nandroid.useAndroidX=true\n' >> android/gradle.properties
      - name: Apply V3.6.1 native and UI polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          p=Path('android/app/src/main/assets/index.html.gz.b64')
          p.with_name('index.html').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))
          PY
          for p in .github/v361/index-1.patch .github/v361/index-2.patch .github/v361/index-3.patch .github/v361/index-4.patch; do
            patch --batch android/app/src/main/assets/index.html < "$p"
          done
          patch --batch android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java < .github/v361/mainactivity.patch
          patch --batch android/app/build.gradle < .github/v361/gradle.patch
      - name: Apply V3.6.2 competitive session version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('android/app/src/main/assets/index.html').read_text().replace('Prism Hop V3.6.1','Prism Hop V3.6.2').replace('3.6.1-android','3.6.2-android')
          Path('android/app/src/main/assets/index.html').write_text(s)
          p=Path('android/app/build.gradle'); g=p.read_text().replace('versionCode 37','versionCode 38',1).replace("versionName '3.6.1-test'","versionName '3.6.2-test'",1); p.write_text(g)
          p=Path('android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java'); a=p.read_text().replace('private static final String APP_VERSION = "3.6.1-test";','private static final String APP_VERSION = "3.6.2-test";',1); p.write_text(a)
          PY
      - name: Apply V3.7.0 Play Integrity and polish
        run: |
          patch --batch android/app/src/main/assets/index.html < .github/v370/index.patch
          patch --batch android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java < .github/v370/mainactivity.patch
          patch --batch android/app/build.gradle < .github/v370/gradle.patch
          grep -q 'versionCode 39' android/app/build.gradle
          grep -q "versionName '3.7.0-test'" android/app/build.gradle
          grep -q "com.google.android.play:integrity:1.6.0" android/app/build.gradle
          grep -q '3.7.0-android' android/app/src/main/assets/index.html
          grep -q 'prism-attest' android/app/src/main/assets/index.html
          grep -q 'PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER = 437567902207L' android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java
      - name: Apply V3.8.0 official Daily Spotlight
        run: |
          python3 .github/v380/patch.py
          grep -q 'versionCode 40' android/app/build.gradle
          grep -q "versionName '3.8.0-test'" android/app/build.gradle
          grep -q '3.8.0-android' android/app/src/main/assets/index.html
          grep -q 'schema_version!==4' android/app/src/main/assets/index.html
          grep -q 'OFFICIAL · PLAY INTEGRITY' android/app/src/main/assets/index.html
          grep -q 'server_replay_v1+play_integrity' android/app/src/main/assets/index.html
      - name: Apply V3.9.0 The Shattering story
        run: |
          python3 .github/v390/patch.py
          grep -q 'versionCode 41' android/app/build.gradle
          grep -q "versionName '3.9.0-test'" android/app/build.gradle
          grep -q '3.9.0-android' android/app/src/main/assets/index.html
          grep -q 'storyIntroSeen' android/app/src/main/assets/index.html
          grep -q 'KEEP THE LIGHT ALIVE.' android/app/src/main/assets/index.html
          grep -q 'Replay The Shattering' android/app/src/main/assets/index.html
          grep -q 'if(window.__PrismStoryOwnsLaunch)return' android/app/src/main/assets/index.html
      - name: Apply V3.9.1 cinematic composition
        run: |
          python3 .github/v391/patch.py
          grep -q 'versionCode 42' android/app/build.gradle
          grep -q "versionName '3.9.1-test'" android/app/build.gradle
          grep -q '3.9.1-android' android/app/src/main/assets/index.html
          grep -q 'v391-story-style' android/app/src/main/assets/index.html
          grep -q "showCopy('YOURS.','yours')" android/app/src/main/assets/index.html
          grep -q '22220' android/app/src/main/assets/index.html
          grep -q 'private static final String APP_VERSION = "3.9.1-test";' android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java
      - name: Apply V3.9.2 patient cinematic and cleanup
        run: |
          python3 .github/v392/patch.py
          python3 .github/v392/fix_pause.py
          grep -q 'versionCode 43' android/app/build.gradle
          grep -q "versionName '3.9.2-test'" android/app/build.gradle
          grep -q '3.9.2-android' android/app/src/main/assets/index.html
          grep -q 'v392-story-style' android/app/src/main/assets/index.html
          grep -q 'v392-native-back' android/app/src/main/assets/index.html
          grep -q "visible('paused')" android/app/src/main/assets/index.html
          ! grep -q "pause-overlay" android/app/src/main/assets/index.html
          grep -q 'schema_version!==4' android/app/src/main/assets/index.html
          grep -q 'No Play-Integrity-verified scores yet' android/app/src/main/assets/index.html
          grep -q '<p>KEEP THE LIGHT ALIVE.</p>' android/app/src/main/assets/index.html
          grep -q 'private static final String APP_VERSION = "3.9.2-test";' android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java
      - name: Apply V3.10.0 tactile polish and Story Mode Sector 01
        run: |
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          raw=base64.b64decode(Path('.github/v3100/patch.py.gz.b64').read_text().strip())
          code=gzip.decompress(raw).decode()
          exec(compile(code,'.github/v3100/patch.py','exec'))
          PY
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('android/app/build.gradle').read_text()
          html=Path('android/app/src/main/assets/index.html').read_text()
          java=Path('android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java').read_text()
          checks=[
              ('versionCode 44','versionCode 44',gradle,False),
              ('versionName 3.10.0-test',"versionName '3.10.0-test'",gradle,False),
              ('3.10.0 Android client','3.10.0-android',html,False),
              ('Sector 01','SECTOR 01',html,True),
              ('The Obsidian Drift','THE OBSIDIAN DRIFT',html,True),
              ('Restoration Gate','RESTORATION',html,True),
              ('Memory Trace','MEMORY TRACE',html,True),
              ('Obsidian Light','OBSIDIAN LIGHT',html,True),
              ('Exit confirmation','EXIT PRISM HOP?',html,True),
              ('native exitApp','exitApp',java,False),
              ('native click haptic','PRIMITIVE_CLICK',java,False),
              ('native 3.10 app version','private static final String APP_VERSION = "3.10.0-test";',java,False),
          ]
          missing=[]
          for label,needle,haystack,fold in checks:
              ok=needle.casefold() in haystack.casefold() if fold else needle in haystack
              print(('OK   ' if ok else 'MISS ') + label)
              if not ok: missing.append(label)
          retired=("THERE'S MORE HOP","THERE’S MORE HOP")
          stale=[p for p in retired if p.casefold() in html.casefold()]
          if stale:
              print('MISS retired copy still present:', ', '.join(stale))
              missing.append('retired THERE’S MORE HOP copy')
          else:
              print('OK   retired THERE’S MORE HOP copy removed')
          if missing:
              raise SystemExit('V3.10 validation failed: '+', '.join(missing))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('android/app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'prism-script-{i}.js'
              p.write_text(js)
              subprocess.run(['node','--check',str(p)],check=True,stdout=subprocess.DEVNULL)
          print('Checked',len(scripts),'inline scripts')
          PY
          zip -qr Prism-Hop-V3.10.0-Android-Source.zip android -x 'android/.gradle/*' 'android/app/build/*'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore Prism Hop upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PRISM_HOP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prism-hop-upload.jks"
          test -s "$RUNNER_TEMP/prism-hop-upload.jks"
      - name: Build V3.10.0
        run: gradle -p android :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Sign V3.10.0 release AAB
        env:
          STORE_PASS: ${{ secrets.PRISM_HOP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.PRISM_HOP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRISM_HOP_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/prism-hop-upload.jks" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab Prism-Hop-V3.10.0-Play-Signed.aab
      - name: Inspect outputs
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -s Prism-Hop-V3.10.0-Play-Signed.aab
          test -s Prism-Hop-V3.10.0-Android-Source.zip
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk Prism-Hop-V3.10.0-Play-Signed.aab Prism-Hop-V3.10.0-Android-Source.zip | tee Prism-Hop-V3.10.0-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Hop-V3.10.0-Play-Signed
          path: |
            Prism-Hop-V3.10.0-Play-Signed.aab
            android/app/build/outputs/apk/debug/app-debug.apk
            Prism-Hop-V3.10.0-Android-Source.zip
            Prism-Hop-V3.10.0-SHA256.txt
          if-no-files-found: error
          retention-days: 14
