name: Prism Hop Android V3.6.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Prism-Hop-V3.6-Android-Source.zip'
      - '.github/workflows/android-v36.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Expand Prism Hop Android source
        run: |
          unzip -q Prism-Hop-V3.6-Android-Source.zip -d build-src
          cp -R build-src/Prism-Hop-V3.6-Android/android ./android
          printf '\nandroid.useAndroidX=true\n' >> android/gradle.properties
      - name: Concise V3.6.1 diagnostics
        run: |
          echo '===== FILES ====='
          find android/app/src/main -type f | sort | head -n 120
          echo '===== APP BUILD ====='
          sed -n '1,240p' android/app/build.gradle 2>/dev/null || sed -n '1,240p' android/app/build.gradle.kts 2>/dev/null || true
          echo '===== MANIFEST ====='
          sed -n '1,260p' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          echo '===== ACTIVITIES ====='
          while IFS= read -r f; do
            echo "--- $f"
            sed -n '1,360p' "$f"
          done < <(find android/app/src/main -type f \( -name '*Activity.java' -o -name '*Activity.kt' -o -name '*MainActivity*' \) | sort)
          echo '===== TARGET MATCHES WITH CONTEXT ====='
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('android/app/src/main')
          rx=re.compile(r'connection interrupted|personal best saved|offline demo|server-issued|there.?s more hop|find your flow|splash|prism-runs|wmicrzmalyekinqvcuxt|supabase|navigator\.onLine|fetch\(|heartbeat|pulse|hero|ring|scroll|background',re.I)
          count=0
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js','.css','.java','.kt','.xml'}: continue
              try: lines=p.read_text(errors='ignore').splitlines()
              except: continue
              hits=[i for i,l in enumerate(lines) if rx.search(l)]
              if not hits: continue
              print(f'--- {p}')
              shown=set()
              for i in hits:
                  if count>=180: break
                  a=max(0,i-3); b=min(len(lines),i+5)
                  key=(a,b)
                  if key in shown: continue
                  shown.add(key)
                  for j in range(a,b): print(f'{j+1}: {lines[j]}')
                  print('...')
                  count+=1
              if count>=180: break
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore Prism Hop upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PRISM_HOP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prism-hop-upload.jks"
          test -s "$RUNNER_TEMP/prism-hop-upload.jks"
      - name: Build debug APK and unsigned release AAB
        run: gradle -p android :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Sign release AAB with permanent upload key
        env:
          STORE_PASS: ${{ secrets.PRISM_HOP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.PRISM_HOP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRISM_HOP_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASS"
          test -n "$KEY_PASS"
          test -n "$KEY_ALIAS"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/prism-hop-upload.jks" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab Prism-Hop-V3.6.1-Play-Signed.aab
      - name: Inspect outputs
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -s Prism-Hop-V3.6.1-Play-Signed.aab
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk Prism-Hop-V3.6.1-Play-Signed.aab | tee Prism-Hop-V3.6.1-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Hop-V3.6.1-Play-Signed
          path: |
            Prism-Hop-V3.6.1-Play-Signed.aab
            android/app/build/outputs/apk/debug/app-debug.apk
            Prism-Hop-V3.6.1-SHA256.txt
          if-no-files-found: error
          retention-days: 14
