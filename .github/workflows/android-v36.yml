name: Prism Hop Android V3.6.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Prism-Hop-V3.6-Android-Source.zip'
      - '.github/workflows/android-v36.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Expand Prism Hop Android source
        run: |
          unzip -q Prism-Hop-V3.6-Android-Source.zip -d build-src
          cp -R build-src/Prism-Hop-V3.6-Android/android ./android
          printf '\nandroid.useAndroidX=true\n' >> android/gradle.properties
      - name: Inspect V3.6.1 patch targets
        run: |
          echo '===== SOURCE FILES ====='
          find android -type f | sort
          echo '===== TARGET STRING MATCHES ====='
          grep -RniE "connection interrupted|personal best saved|offline demo|server-issued|there.?s more hop|find your flow|splash|WebView|prism-runs|wmicrzmalyekinqvcuxt|supabase|network|offline|online|hero|ring|pulse" android/app/src android 2>/dev/null | head -n 1200 || true
          echo '===== MANIFEST ====='
          cat android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          echo '===== MAIN ACTIVITY CANDIDATES ====='
          find android/app/src/main -type f \( -name '*MainActivity*' -o -name '*Activity.java' -o -name '*Activity.kt' \) -print -exec sh -c 'echo "--- $1"; sed -n "1,320p" "$1"' _ {} \;
          echo '===== WEB ASSET CANDIDATES ====='
          find android/app/src/main -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print
          for f in $(find android/app/src/main -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \)); do
            echo "--- $f"
            grep -niE "connection interrupted|personal best saved|offline demo|server-issued|there.?s more hop|find your flow|splash|prism-runs|wmicrzmalyekinqvcuxt|supabase|hero|ring|pulse" "$f" | head -n 300 || true
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore Prism Hop upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PRISM_HOP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prism-hop-upload.jks"
          test -s "$RUNNER_TEMP/prism-hop-upload.jks"
      - name: Build debug APK and unsigned release AAB
        run: gradle -p android :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Sign release AAB with permanent upload key
        env:
          STORE_PASS: ${{ secrets.PRISM_HOP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.PRISM_HOP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRISM_HOP_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASS"
          test -n "$KEY_PASS"
          test -n "$KEY_ALIAS"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/prism-hop-upload.jks" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab Prism-Hop-V3.6.1-Play-Signed.aab
      - name: Inspect outputs
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -s Prism-Hop-V3.6.1-Play-Signed.aab
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk Prism-Hop-V3.6.1-Play-Signed.aab | tee Prism-Hop-V3.6.1-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Hop-V3.6.1-Play-Signed
          path: |
            Prism-Hop-V3.6.1-Play-Signed.aab
            android/app/build/outputs/apk/debug/app-debug.apk
            Prism-Hop-V3.6.1-SHA256.txt
          if-no-files-found: error
          retention-days: 14
