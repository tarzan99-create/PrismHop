name: Prism Hop Android V3.12.0 First Spark

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/v3120/**'
      - '.github/workflows/android-v312.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified V3.11.0 source baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10498928541/zip" \
            -o v311-artifact.zip
          unzip -q v311-artifact.zip -d v311-artifact
          test -s v311-artifact/Prism-Hop-V3.11.0-Android-Source.zip
          unzip -q v311-artifact/Prism-Hop-V3.11.0-Android-Source.zip -d build-src
          cp -R build-src/android ./android

      - name: Apply V3.12.0 FIRST SPARK vertical slice
        run: |
          cat .github/v3120/chunk_00 .github/v3120/chunk_01 .github/v3120/chunk_02 .github/v3120/chunk_03 > /tmp/v312.b64
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          raw=base64.b64decode(Path('/tmp/v312.b64').read_text().strip())
          code=gzip.decompress(raw).decode()
          code=code.replace("Path('/mnt/data/prism312/android')","Path('android')")
          code=code.replace("Path('/mnt/data/prism312b/android')","Path('android')")
          exec(compile(code,'.github/v3120/patch.py','exec'))
          PY
          grep -q 'versionCode 46' android/app/build.gradle
          grep -q "versionName '3.12.0-test'" android/app/build.gradle
          grep -q '3.12.0-android' android/app/src/main/assets/index.html
          grep -q 'v3120-first-spark-style' android/app/src/main/assets/index.html
          grep -q 'story-cinematic-v312' android/app/src/main/assets/index.html
          grep -q 'MEMORY GATE' android/app/src/main/assets/index.html
          grep -q 'storyShatterAudio' android/app/src/main/assets/index.html
          grep -q 'storyFirstSparkScoreOpening' android/app/src/main/assets/index.html
          grep -q 'storyGateTravelClock' android/app/src/main/assets/index.html
          grep -q 'private static final String APP_VERSION = "3.12.0-test";' android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,gzip,base64
          s=Path('android/app/src/main/assets/index.html').read_text()
          if s.count('v3120-first-spark-style') != 1:
              raise SystemExit('Duplicate/missing V3.12 style')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'prism312-script-{i}.js'
              p.write_text(js)
              subprocess.run(['node','--check',str(p)],check=True,stdout=subprocess.DEVNULL)
          asset=Path('android/app/src/main/assets/index.html')
          asset.with_name('index.html.gz.b64').write_text(base64.b64encode(gzip.compress(asset.read_bytes(),9)).decode())
          print('Checked',len(scripts),'inline scripts')
          PY
          zip -qr Prism-Hop-V3.12.0-Android-Source.zip android -x 'android/.gradle/*' 'android/app/build/*'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Prism Hop upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PRISM_HOP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prism-hop-upload.jks"
          test -s "$RUNNER_TEMP/prism-hop-upload.jks"

      - name: Build V3.12.0
        run: gradle -p android :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Sign V3.12.0 release AAB
        env:
          STORE_PASS: ${{ secrets.PRISM_HOP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.PRISM_HOP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRISM_HOP_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/prism-hop-upload.jks" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab Prism-Hop-V3.12.0-Play-Signed.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk Prism-Hop-V3.12.0-Test.apk

      - name: Inspect V3.12.0 outputs
        run: |
          test -s Prism-Hop-V3.12.0-Test.apk
          test -s Prism-Hop-V3.12.0-Play-Signed.aab
          test -s Prism-Hop-V3.12.0-Android-Source.zip
          sha256sum Prism-Hop-V3.12.0-Test.apk Prism-Hop-V3.12.0-Play-Signed.aab Prism-Hop-V3.12.0-Android-Source.zip | tee Prism-Hop-V3.12.0-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Hop-V3.12.0-First-Spark
          path: |
            Prism-Hop-V3.12.0-Test.apk
            Prism-Hop-V3.12.0-Play-Signed.aab
            Prism-Hop-V3.12.0-Android-Source.zip
            Prism-Hop-V3.12.0-SHA256.txt
          if-no-files-found: error
          retention-days: 14
