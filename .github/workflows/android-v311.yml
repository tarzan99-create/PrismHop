name: Prism Hop Android V3.11.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/v3110/**'
      - '.github/workflows/android-v311.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified V3.10.0 source baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10494651579/zip" \
            -o v310-artifact.zip
          unzip -q v310-artifact.zip -d v310-artifact
          test -s v310-artifact/Prism-Hop-V3.10.0-Android-Source.zip
          unzip -q v310-artifact/Prism-Hop-V3.10.0-Android-Source.zip -d build-src
          cp -R build-src/android ./android

      - name: Apply V3.11.0 Story Universe rebuild
        run: |
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          raw=base64.b64decode(Path('.github/v3110/patch.py.gz.b64').read_text().strip())
          code=gzip.decompress(raw).decode()
          exec(compile(code,'.github/v3110/patch.py','exec'))
          PY
          grep -q 'versionCode 45' android/app/build.gradle
          grep -q "versionName '3.11.0-test'" android/app/build.gradle
          grep -q '3.11.0-android' android/app/src/main/assets/index.html
          grep -q 'v3110-story-universe-style' android/app/src/main/assets/index.html
          grep -q 'THE FIRST FRAGMENT' android/app/src/main/assets/index.html
          grep -q 'THE DEAD NETWORK' android/app/src/main/assets/index.html
          grep -q 'FALSE MEMORY' android/app/src/main/assets/index.html
          grep -q 'THE ECHO' android/app/src/main/assets/index.html
          grep -q 'REJECTION' android/app/src/main/assets/index.html
          grep -q 'THE RESTORATION GATE' android/app/src/main/assets/index.html
          grep -q 'LIGHT HAS MEMORY' android/app/src/main/assets/index.html
          grep -q 'MEMORY GATE' android/app/src/main/assets/index.html
          grep -q 'story-pulse-btn' android/app/src/main/assets/index.html
          grep -q 'storyMusicStart' android/app/src/main/assets/index.html
          grep -q 'WELCOME BACK, PRISM.' android/app/src/main/assets/index.html
          grep -q 'private static final String APP_VERSION = "3.11.0-test";' android/app/src/main/java/com/zarivostudios/prismhop/MainActivity.java
          ! grep -q 'BROKEN ORBIT' android/app/src/main/assets/index.html
          ! grep -q 'COLOUR WAKE' android/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('android/app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'prism311-script-{i}.js'
              p.write_text(js)
              subprocess.run(['node','--check',str(p)],check=True,stdout=subprocess.DEVNULL)
          story=re.search(r'const STORY_LEVELS=\[(.*?)\];',s,re.S)
          if not story or story.group(1).count("title:") != 10:
              raise SystemExit('Expected exactly 10 authored Story chapters')
          print('Checked',len(scripts),'inline scripts and 10 Story chapters')
          PY
          zip -qr Prism-Hop-V3.11.0-Android-Source.zip android -x 'android/.gradle/*' 'android/app/build/*'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Prism Hop upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PRISM_HOP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prism-hop-upload.jks"
          test -s "$RUNNER_TEMP/prism-hop-upload.jks"

      - name: Build V3.11.0
        run: gradle -p android :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Sign V3.11.0 release AAB
        env:
          STORE_PASS: ${{ secrets.PRISM_HOP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.PRISM_HOP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRISM_HOP_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/prism-hop-upload.jks" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab Prism-Hop-V3.11.0-Play-Signed.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk Prism-Hop-V3.11.0-Test.apk

      - name: Inspect V3.11.0 outputs
        run: |
          test -s Prism-Hop-V3.11.0-Test.apk
          test -s Prism-Hop-V3.11.0-Play-Signed.aab
          test -s Prism-Hop-V3.11.0-Android-Source.zip
          sha256sum Prism-Hop-V3.11.0-Test.apk Prism-Hop-V3.11.0-Play-Signed.aab Prism-Hop-V3.11.0-Android-Source.zip | tee Prism-Hop-V3.11.0-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Hop-V3.11.0-Story-Universe
          path: |
            Prism-Hop-V3.11.0-Test.apk
            Prism-Hop-V3.11.0-Play-Signed.aab
            Prism-Hop-V3.11.0-Android-Source.zip
            Prism-Hop-V3.11.0-SHA256.txt
          if-no-files-found: error
          retention-days: 14
